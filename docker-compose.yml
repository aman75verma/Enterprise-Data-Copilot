# Enterprise Data Copilot — Docker Compose
# Services: postgres (with pgvector), backend (FastAPI), frontend (React)
# Usage: docker-compose up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: copilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: copilot_db
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - copilot_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: copilot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://copilot:copilot_pass@postgres:5432/copilot_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - copilot_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: copilot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - copilot_net

volumes:
  postgres_data:

networks:
  copilot_net:
    driver: bridge

